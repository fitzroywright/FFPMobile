# Replace the three 192.0.2.* documentation placeholders before installation.
server {
    listen 192.0.2.10:443 ssl;
    listen 127.0.0.1:443 ssl;
    server_name mobile.ffpja.org;
    ssl_certificate /etc/ssl/aegis/mobile.ffpja.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/aegis/mobile.ffpja.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;

    allow 127.0.0.1;
    allow 192.0.2.16/28; # Internal warehouse tablet network
    allow 192.0.2.32/28; # Approved VPN network
    deny all;

    location ^~ /api/admin/ {
        # Replace with the approved administrative VPN or management subnet.
        allow 192.0.2.48/28;
        deny all;

        proxy_pass http://127.0.0.1:5197;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:5197;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
